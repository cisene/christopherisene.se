
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta http-equiv="expires" content="86400">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="robots" content="index,follow">
  <meta name="revisit-after" content="7 days">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <meta name="HandheldFriendly" content="true">
  <meta name="country" content="{{ .Site.Params.countryShort }}">

  <meta name="description" content="{{ .Title }}">
  <meta name="author" content="{{ .Params.author }}">
  <meta name="google" content="notranslate">
  <meta name="content" content="general">
  <meta name="category" content="site;sv">
  <meta name="category" content="contexttype;page">

  <meta property="og:locale" content="{{ .Site.Params.languageCode }}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ .Title }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:image" content="/{{ .Site.Params.favicon }}">
  <meta property="og:image:secure_url" content="/{{ .Site.Params.favicon }}">

  <meta name="dcterms.identifier" content="{{ .Permalink }}">
  <meta name="dcterms.language" content="{{ .Site.Params.languageCode }}">
  <meta name="dcterms.format" content="text/html">
  <meta name="dcterms.type" content="text">

  <meta property="dc:Title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}">
  <meta property="dc:Description" content="{{ .Title }}">
  <meta property="dc:Identifier" content="{{ .Permalink }}">
  <meta property="dc:Creator" content="{{ .Params.author }}">
  <meta property="dc:Creator.Address" content="{{ .Site.Params.email }}">
  <meta property="dc:Publisher" content="{{ .Params.author }}">
  <meta property="dc:Publisher.Address" content="{{ .Site.Params.email }}">
  <meta property="dc:Type" content="Text">
  <meta property="dc:Format" content="text/html">
  <meta property="dc:Language" content="{{ .Site.Params.languageCode }}">

  <meta name="format-detection" content="telefone=no">
  <meta name="format-detection" content="date=no">
  <meta name="format-detection" content="address=no">
  <meta name="format-detection" content="email=no">

  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  {{ $style := resources.Get "css/style.css" | resources.Minify }}
  <link rel="stylesheet" href="{{ $style.RelPermalink }}">

  <!-- Include Schema.org Structured Data -->
  {{ partial "schema.html" . }}
